
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria - Rysiu998</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Segoe UI, sans-serif;
}

body {
    background: linear-gradient(90deg, #13203f, #08162f, #13203f);
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 45px 15px;
}

header h1 {
    color: #ff4b4b;
    font-size: 42px;
    text-shadow: 0 0 20px #ff4b4b;
}

header p {
    color: #cbd5e1;
    margin-top: 12px;
}

.powrot {
    display: inline-block;
    margin-top: 20px;
    padding: 13px 22px;
    background: #ff4b4b;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    cursor: pointer;
    border: none;
}

#albumy, #zdjecia {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.lista-albumow, .galeria {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.album {
    background: #18243a;
    border: 2px solid #ff4b4b;
    border-radius: 16px;
    padding: 35px 15px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.album:hover {
    transform: scale(1.03);
    box-shadow: 0 0 20px #ff4b4b;
}

.album .ikona {
    font-size: 55px;
}

.album h3 {
    margin-top: 12px;
    color: #ff7777;
}

.album p {
    margin-top: 8px;
    color: #cbd5e1;
}

.galeria img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    border-radius: 16px;
    border: 2px solid #ff4b4b;
    cursor: pointer;
    transition: 0.3s;
}

.galeria img:hover {
    transform: scale(1.03);
    box-shadow: 0 0 20px #ff4b4b;
}

#zdjecia {
    display: none;
}

#tytulAlbumu {
    color: #ff7777;
    margin-bottom: 20px;
}

#podglad {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    justify-content: center;
    align-items: center;
    padding: 15px;
    z-index: 10;
}

#podglad img {
    max-width: 95%;
    max-height: 85vh;
    object-fit: contain;
    border: 2px solid #ff4b4b;
    border-radius: 12px;
}

#zamknij {
    position: absolute;
    top: 15px;
    right: 22px;
    font-size: 40px;
    color: white;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px 15px;
    margin-top: 40px;
    background: #4d0000;
    border-top: 3px solid #ff4b4b;
}

@media (max-width: 768px) {
    .lista-albumow, .galeria {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .galeria img {
        height: 150px;
    }
}

@media (max-width: 400px) {
    .lista-albumow, .galeria {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>📷 Galeria Rysiu998</h1>
    <p>Szkolenia • Akcje ratownicze • Ćwiczenia</p>
    <a href="index.html" class="powrot">← Powrót na stronę główną</a>
</header>

<section id="albumy">
    <h2 style="margin-bottom:20px;">📁 Nasze albumy</h2>
    <div id="listaAlbumow" class="lista-albumow">
        <p>Ładowanie albumów...</p>
    </div>
</section>

<section id="zdjecia">
    <button class="powrot" onclick="pokazAlbumy()">← Wróć do albumów</button>
    <h2 id="tytulAlbumu"></h2>
    <div id="listaZdjec" class="galeria"></div>
</section>

<div id="podglad" onclick="zamknij()">
    <span id="zamknij">&times;</span>
    <img id="duzeZdjecie" src="" alt="Powiększone zdjęcie">
</div>

<footer>
    🚒 OSP MICHAŁOWO • Rysiu998<br><br>
    © 2026 Krystian "Rysiu998"
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const stareZdjecia = Array.from(
    { length: 21 },
    (_, i) => `zdjecia/akcja${i + 1}.jpg`
);

async function pobierzAlbumy() {
    const lista = document.getElementById("listaAlbumow");

    const { data, error } = await supabaseClient
        .from("albumy")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        lista.textContent = "Nie udało się pobrać albumów.";
        console.error(error);
        return;
    }

    lista.innerHTML = "";

    data.forEach(album => {
        const karta = document.createElement("div");
        karta.className = "album";

        const ikona = document.createElement("div");
        ikona.className = "ikona";
        ikona.textContent = "📁";

        const nazwa = document.createElement("h3");
        nazwa.textContent = album.nazwa;

        const opis = document.createElement("p");
        opis.textContent = album.opis || "Kliknij, aby zobaczyć zdjęcia";

        karta.append(ikona, nazwa, opis);
        karta.addEventListener("click", () => otworzAlbum(album));

        lista.appendChild(karta);
    });

    if (data.length === 0) {
        lista.textContent = "Nie ma jeszcze żadnych albumów.";
    }

    // Dotychczasowe 21 zdjęć pozostają dostępne
    const stare = document.createElement("div");
    stare.className = "album";
    stare.innerHTML = `
        <div class="ikona">📸</div>
        <h3>Dotychczasowa galeria</h3>
        <p>Nasze wcześniejsze zdjęcia</p>
    `;
    stare.addEventListener("click", pokazStareZdjecia);
    lista.appendChild(stare);
}

async function otworzAlbum(album) {
    document.getElementById("albumy").style.display = "none";
    document.getElementById("zdjecia").style.display = "block";
    document.getElementById("tytulAlbumu").textContent = "📁 " + album.nazwa;

    const lista = document.getElementById("listaZdjec");
    lista.innerHTML = "<p>Ładowanie zdjęć...</p>";

    const { data, error } = await supabaseClient
        .from("zdjecia_galerii")
        .select("*")
        .eq("album_id", album.id)
        .order("created_at", { ascending: false });

    if (error) {
        lista.textContent = "Nie udało się pobrać zdjęć.";
        console.error(error);
        return;
    }

    lista.innerHTML = "";

    if (data.length === 0) {
        lista.textContent = "W tym albumie nie ma jeszcze zdjęć.";
        return;
    }

    data.forEach(zdjecie => {
        const url = supabaseClient.storage
            .from("zdjecia-akcji")
            .getPublicUrl(zdjecie.sciezka).data.publicUrl;

        dodajZdjecie(lista, url, zdjecie.nazwa_pliku);
    });
}

function pokazStareZdjecia() {
    document.getElementById("albumy").style.display = "none";
    document.getElementById("zdjecia").style.display = "block";
    document.getElementById("tytulAlbumu").textContent = "📸 Dotychczasowa galeria";

    const lista = document.getElementById("listaZdjec");
    lista.innerHTML = "";

    stareZdjecia.forEach((url, i) => {
        dodajZdjecie(lista, url, "Zdjęcie " + (i + 1));
    });
}

function dodajZdjecie(lista, url, opis) {
    const img = document.createElement("img");
    img.src = url;
    img.alt = opis;
    img.loading = "lazy";
    img.addEventListener("click", () => pokaz(img));
    lista.appendChild(img);
}

function pokazAlbumy() {
    document.getElementById("zdjecia").style.display = "none";
    document.getElementById("albumy").style.display = "block";
}

function pokaz(zdjecie) {
    document.getElementById("duzeZdjecie").src = zdjecie.src;
    document.getElementById("podglad").style.display = "flex";
}

function zamknij() {
    document.getElementById("podglad").style.display = "none";
}

document.getElementById("duzeZdjecie").addEventListener("click", e => {
    e.stopPropagation();
});

pobierzAlbumy();
</script>

</body>
</html>
