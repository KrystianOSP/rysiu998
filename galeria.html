
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria - Rysiu998</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Segoe UI, sans-serif;
}

body {
    background: linear-gradient(90deg, #13203f, #08162f, #13203f);
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 45px 15px;
}

header h1 {
    color: #ff4b4b;
    font-size: 42px;
    text-shadow: 0 0 20px #ff4b4b;
}

header p {
    color: #cbd5e1;
    margin-top: 12px;
}

.powrot {
    display: inline-block;
    margin-top: 20px;
    padding: 13px 22px;
    background: #ff4b4b;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    cursor: pointer;
    border: none;
}

#albumy, #zdjecia {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.lista-albumow, .galeria {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.album {
    background: #18243a;
    border: 2px solid #ff4b4b;
    border-radius: 16px;
    padding: 35px 15px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.album:hover {
    transform: scale(1.03);
    box-shadow: 0 0 20px #ff4b4b;
}

.album .ikona {
    font-size: 55px;
}

.album h3 {
    margin-top: 12px;
    color: #ff7777;
}

.album p {
    margin-top: 8px;
    color: #cbd5e1;
}

.galeria img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    border-radius: 16px;
    border: 2px solid #ff4b4b;
    cursor: pointer;
}

#zdjecia {
    display: none;
}

#tytulAlbumu {
    color: #ff7777;
    margin: 20px 0;
}

#podglad {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    padding: 65px 70px;
    z-index: 9999;
    touch-action: pan-y;
}

#duzeZdjecie {
    max-width: 100%;
    max-height: 82vh;
    object-fit: contain;
    border: 2px solid #ff4b4b;
    border-radius: 12px;
    user-select: none;
    -webkit-user-drag: none;
}

.strzalka {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 55px;
    height: 55px;
    border: 2px solid white;
    border-radius: 50%;
    background: #ff3333;
    color: white;
    font-size: 30px;
    cursor: pointer;
    z-index: 10001;
    display: flex;
    align-items: center;
    justify-content: center;
}

#poprzednie {
    left: 12px;
}

#nastepne {
    right: 12px;
}

#zamknij {
    position: absolute;
    top: 12px;
    right: 22px;
    font-size: 45px;
    color: white;
    cursor: pointer;
    z-index: 10002;
}

#licznikZdjec {
    position: absolute;
    bottom: 15px;
    color: white;
    font-size: 18px;
    background: rgba(0,0,0,0.6);
    padding: 8px 16px;
    border-radius: 20px;
}

footer {
    text-align: center;
    padding: 30px 15px;
    margin-top: 40px;
    background: #4d0000;
    border-top: 3px solid #ff4b4b;
}

@media (max-width: 768px) {
    .lista-albumow, .galeria {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .galeria img {
        height: 150px;
    }
}

@media (max-width: 500px) {
    .lista-albumow, .galeria {
        grid-template-columns: 1fr;
    }

    #podglad {
        padding: 65px 48px;
    }

    #duzeZdjecie {
        max-width: 100%;
        max-height: 75vh;
    }

    .strzalka {
        width: 42px;
        height: 42px;
        font-size: 24px;
    }

    #poprzednie {
        left: 4px;
    }

    #nastepne {
        right: 4px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📷 Galeria Rysiu998</h1>
    <p>Szkolenia • Akcje ratownicze • Ćwiczenia</p>
    <a href="index.html" class="powrot">← Powrót na stronę główną</a>
</header>

<section id="albumy">
    <h2 style="margin-bottom:20px;">📁 Nasze albumy</h2>
    <div id="listaAlbumow" class="lista-albumow">
        <p>Ładowanie albumów...</p>
    </div>
</section>

<section id="zdjecia">
    <button class="powrot" onclick="pokazAlbumy()">← Wróć do albumów</button>
    <h2 id="tytulAlbumu"></h2>
    <div id="listaZdjec" class="galeria"></div>
</section>

<div id="podglad">
    <span id="zamknij">&times;</span>
    <button id="poprzednie" class="strzalka" aria-label="Poprzednie zdjęcie">&#10094;</button>
    <img id="duzeZdjecie" src="" alt="Powiększone zdjęcie">
    <button id="nastepne" class="strzalka" aria-label="Następne zdjęcie">&#10095;</button>
    <div id="licznikZdjec"></div>
</div>

<footer>
    🚒 OSP MICHAŁOWO • Rysiu998<br><br>
    © 2026 Krystian "Rysiu998"
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const stareZdjecia = Array.from(
    { length: 21 },
    (_, i) => `zdjecia/akcja${i + 1}.jpg`
);

async function pobierzAlbumy() {
    const lista = document.getElementById("listaAlbumow");

    try {
        const { data, error } = await supabaseClient
            .from("albumy")
            .select("*")
            .order("created_at", { ascending: false });

        if (error) throw error;

        lista.innerHTML = "";

        data.forEach(album => {
            const karta = document.createElement("div");
            karta.className = "album";

            const ikona = document.createElement("div");
            ikona.className = "ikona";
            ikona.textContent = "📁";

            const nazwa = document.createElement("h3");
            nazwa.textContent = album.nazwa;

            const opis = document.createElement("p");
            opis.textContent = album.opis || "Kliknij, aby zobaczyć zdjęcia";

            karta.append(ikona, nazwa, opis);
            karta.addEventListener("click", () => otworzAlbum(album));

            lista.appendChild(karta);
        });

        const stare = document.createElement("div");
        stare.className = "album";
        stare.innerHTML = `
            <div class="ikona">📸</div>
            <h3>Dotychczasowa galeria</h3>
            <p>Nasze wcześniejsze zdjęcia</p>
        `;
        stare.addEventListener("click", pokazStareZdjecia);
        lista.appendChild(stare);

    } catch (error) {
        lista.textContent = "Nie udało się pobrać albumów.";
        console.error("Błąd albumów:", error);
    }
}

async function otworzAlbum(album) {
    document.getElementById("albumy").style.display = "none";
    document.getElementById("zdjecia").style.display = "block";
    document.getElementById("tytulAlbumu").textContent = "📁 " + album.nazwa;

    const lista = document.getElementById("listaZdjec");
    lista.innerHTML = "<p>Ładowanie zdjęć...</p>";

    try {
        const { data, error } = await supabaseClient
            .from("zdjecia_galerii")
            .select("*")
            .eq("album_id", album.id)
            .order("created_at", { ascending: false });

        if (error) throw error;

        lista.innerHTML = "";

        if (!data || data.length === 0) {
            lista.textContent = "W tym albumie nie ma jeszcze zdjęć.";
            return;
        }

        data.forEach(zdjecie => {
            const url = supabaseClient.storage
                .from("zdjecia-akcji")
                .getPublicUrl(zdjecie.sciezka).data.publicUrl;

            dodajZdjecie(lista, url, zdjecie.nazwa_pliku);
        });

    } catch (error) {
        lista.textContent = "Nie udało się pobrać zdjęć.";
        console.error("Błąd zdjęć:", error);
    }
}

function pokazStareZdjecia() {
    document.getElementById("albumy").style.display = "none";
    document.getElementById("zdjecia").style.display = "block";
    document.getElementById("tytulAlbumu").textContent = "📸 Dotychczasowa galeria";

    const lista = document.getElementById("listaZdjec");
    lista.innerHTML = "";

    stareZdjecia.forEach((url, i) => {
        dodajZdjecie(lista, url, "Zdjęcie " + (i + 1));
    });
}

function dodajZdjecie(lista, url, opis) {
    const img = document.createElement("img");
    img.src = url;
    img.alt = opis;
    img.loading = "lazy";
    img.addEventListener("click", () => pokaz(img));
    lista.appendChild(img);
}

function pokazAlbumy() {
    zamknij();
    document.getElementById("zdjecia").style.display = "none";
    document.getElementById("albumy").style.display = "block";
}

let zdjeciaPodgladu = [];
let aktualneZdjecie = 0;
let dotykStart = 0;

const podglad = document.getElementById("podglad");
const duzeZdjecie = document.getElementById("duzeZdjecie");

function pokaz(zdjecie) {
    zdjeciaPodgladu = Array.from(
        document.querySelectorAll("#listaZdjec img")
    ).map(img => ({
        src: img.src,
        alt: img.alt
    }));

    aktualneZdjecie = zdjeciaPodgladu.findIndex(
        img => img.src === zdjecie.src
    );

    if (aktualneZdjecie < 0) return;

    wyswietlAktualneZdjecie();
    podglad.style.display = "flex";
}

function wyswietlAktualneZdjecie() {
    const zdjecie = zdjeciaPodgladu[aktualneZdjecie];
    if (!zdjecie) return;

    duzeZdjecie.src = zdjecie.src;
    duzeZdjecie.alt = zdjecie.alt;

    document.getElementById("licznikZdjec").textContent =
        `${aktualneZdjecie + 1} / ${zdjeciaPodgladu.length}`;

    document.getElementById("poprzednie").style.display =
        zdjeciaPodgladu.length > 1 ? "flex" : "none";

    document.getElementById("nastepne").style.display =
        zdjeciaPodgladu.length > 1 ? "flex" : "none";
}

function zmienZdjecie(kierunek) {
    if (zdjeciaPodgladu.length < 2) return;

    aktualneZdjecie =
        (aktualneZdjecie + kierunek + zdjeciaPodgladu.length)
        % zdjeciaPodgladu.length;

    wyswietlAktualneZdjecie();
}

function zamknij() {
    podglad.style.display = "none";
    duzeZdjecie.src = "";
}

document.getElementById("poprzednie").addEventListener("click", e => {
    e.stopPropagation();
    zmienZdjecie(-1);
});

document.getElementById("nastepne").addEventListener("click", e => {
    e.stopPropagation();
    zmienZdjecie(1);
});

document.getElementById("zamknij").addEventListener("click", zamknij);

duzeZdjecie.addEventListener("click", e => {
    e.stopPropagation();
});

podglad.addEventListener("click", e => {
    if (e.target === podglad) zamknij();
});

document.addEventListener("keydown", e => {
    if (podglad.style.display !== "flex") return;

    if (e.key === "ArrowRight") zmienZdjecie(1);
    if (e.key === "ArrowLeft") zmienZdjecie(-1);
    if (e.key === "Escape") zamknij();
});

podglad.addEventListener("touchstart", e => {
    dotykStart = e.changedTouches[0].clientX;
}, { passive: true });

podglad.addEventListener("touchend", e => {
    const roznica = e.changedTouches[0].clientX - dotykStart;

    if (Math.abs(roznica) > 50) {
        zmienZdjecie(roznica < 0 ? 1 : -1);
    }
}, { passive: true });

pobierzAlbumy();
</script>

</body>
</html>
